name: Build approved Christmas mockup
on:
  push:
    paths:
      - 'public/images/_mockup_chunks/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble uploaded image and optimize for mobile
        shell: bash
        run: |
          set -euo pipefail
          cat public/images/_mockup_chunks/chunk-*.b64 | base64 --decode > /tmp/natal-mockup.png
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/natal-mockup.png').convert('RGB')
          im.thumbnail((900, 950), Image.Resampling.LANCZOS)
          im.save('public/images/modelos/mockup-natal-hero-aprovado.webp', 'WEBP', quality=72, method=6)
          print('Approved image optimized', im.size)
          PY
          rm -rf public/images/_mockup_chunks
      - name: Commit final image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images/_mockup_chunks public/images/modelos/mockup-natal-hero-aprovado.webp
          git commit -m "Add optimized approved hero mockup" || exit 0
          git push origin HEAD:main
